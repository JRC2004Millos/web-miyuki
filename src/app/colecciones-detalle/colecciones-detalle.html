<section class="catalogo">
  <div class="section-header">
    <h1>Colección: {{ nombreColeccion }}</h1>
  </div>

  <div class="grid-productos">
    <div
      class="card"
      [routerLink]="['/producto', item.id]"
      *ngFor="let item of productos$ | async; let i = index"
    >
      <div class="card__shine"></div>
      <div class="card__glow"></div>
      <div class="card__content">
        <div class="card__badge">NUEVO</div>
        <div class="card__image imagen-container">
          <img
            [src]="item.imagen"
            [alt]="item.nombre"
            class="imagen-principal"
            loading="lazy"
          />
          <img
            [src]="item.imagenAlt"
            [alt]="item.nombre + ' alternativo'"
            class="imagen-hover"
            loading="lazy"
          />
        </div>

        <div class="card__text">
          <p class="card__title">{{ item.nombre }}</p>
          <p class="card__description">Diseño hecho a mano</p>
        </div>
        <div class="card__footer">
          <div class="card__price">
            {{ item.precio | currency: 'COP ':'symbol':'1.0-0' }}
          </div>
          <div class="card__button">
            <svg height="16" width="16" viewBox="0 0 24 24">
              <path
                stroke-width="2"
                stroke="currentColor"
                d="M4 12H20M12 4V20"
                fill="currentColor"
              ></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="volver-wrapper">
    <button
      class="bg-white text-center w-48 rounded-2xl h-14 relative text-black text-xl font-semibold group"
      type="button"
      (click)="volver()"
    >
      <div
        class="bg-[#CBA3BE] rounded-xl h-12 w-1/4 flex items-center justify-center absolute left-1 top-[4px] group-hover:w-[184px] z-10 duration-500"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 1024 1024"
          height="25px"
          width="25px"
        >
          <path
            d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z"
            fill="#000000"
          ></path>
          <path
            d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z"
            fill="#000000"
          ></path>
        </svg>
      </div>
      <p class="translate-x-2">VOLVER</p>
    </button>
  </div>
</section>
